<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Placar | PET Elétrica</title>
  <meta name="description" content="Placar em tempo real da votação popular da Feira de Engenharia e Energia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261128c">
</head>
<body>
  <div class="hero-moldura">
    <header class="hero hero-curto">
      <img class="hero-cena" src="img/cena.svg" alt="">

      <nav class="nav" aria-label="Principal">
        <div class="nav-links">
          <a href="index.html">Início</a>
          <a href="projetos.html">Projetos</a>
          <a href="placar.html" aria-current="page">Placar</a>
          <a href="feiras.html">Feiras</a>
          <a href="inscricoes.html">Inscrições</a>
        </div>
        <a class="marca" href="index.html">
          <img src="img/logo-pet-compacto.png" alt="PET Elétrica UFPB">
        </a>
        <div class="nav-acoes">
          <a class="btn btn-amber nav-acao nav-podio" href="podio.html">Modo pódio</a>
        </div>
      </nav>

      <div class="hero-feiras">
        <span class="etiqueta" id="etiqueta"><span class="ponto-vivo"></span><span id="etiqueta-texto">Votação</span></span>
        <h1>O placar, <em>em tempo real.</em></h1>
      </div>
    </header>
  </div>

  <main class="secao secao-placar" id="placar">
    <div class="placar-topo">
      <div>
        <p class="rotulo">Voto popular</p>
        <h2 class="titulo-secao">Ranking <em>dos projetos.</em></h2>
        <p class="aviso-demo" id="aviso-placar" hidden>Sem conexão com o Firebase: mostrando o último resultado</p>
      </div>
      <div class="total">
        <b id="total-votos">–</b>
        <span class="rotulo">votos no total</span>
        <a class="btn btn-amber" href="podio.html">Modo pódio</a>
      </div>
    </div>
    <div class="placar-corpo">
      <div class="ranking-caixa" id="ranking-caixa">
        <ol class="ranking" id="ranking"></ol>
        <button class="ver-mais" id="ver-mais" type="button" aria-controls="ranking" aria-expanded="false" hidden>
          <span id="ver-mais-texto">Ver mais</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <aside class="urnas" id="urnas" aria-label="Situação das urnas"></aside>
    </div>
  </main>

  <footer class="rodape">
    <span class="marca">
      <img src="img/logo-pet-compacto.png" alt="PET Elétrica UFPB">
    </span>
    <span>Feira de Engenharia e Energia · <a class="link" href="feiras.html">Edições anteriores</a></span>
  </footer>

  <script src="js/data.js?v=20261128c"></script>
  <script src="js/api.js?v=20261128c"></script>
  <script src="js/placar.js?v=20261128c"></script>
</body>
</html>
