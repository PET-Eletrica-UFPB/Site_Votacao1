      <path d="M0 0 L-3 -4 L-1 -50 L1 -50 L3 -4Z"/>
      <path d="M0 0 L-3 -4 L-1 -50 L1 -50 L3 -4Z" transform="rotate(120)"/>
      <path d="M0 0 L-3 -4 L-1 -50 L1 -50 L3 -4Z" transform="rotate(240)"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#ceu)"/>
  <circle cx="820" cy="770" r="520" fill="url(#sol)"/>

  <g fill="#f8f5ec" opacity=".55">
    <circle cx="120" cy="70" r="1.4"/><circle cx="420" cy="140" r="1"/><circle cx="640" cy="60" r="1.5"/>
    <circle cx="880" cy="170" r="1"/><circle cx="1060" cy="80" r="1.3"/><circle cx="1290" cy="150" r="1"/>
    <circle cx="1490" cy="60" r="1.5"/><circle cx="260" cy="230" r="1"/><circle cx="1180" cy="260" r="1"/>
    <circle cx="760" cy="280" r="1.1"/><circle cx="1420" cy="310" r="1"/><circle cx="520" cy="330" r="1"/>
  </g>

  <g fill="#14306a" opacity=".8">
