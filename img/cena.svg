    <use href="#aero" transform="translate(330 735) scale(.7)"/>
    <use href="#aero" transform="translate(1180 720) scale(.85)"/>
    <use href="#aero" transform="translate(1330 705) scale(1.05)"/>
    <use href="#aero" transform="translate(1490 735) scale(.7)"/>
  </g>

  <path fill="url(#morro1)" d="M0 810 C180 760 340 790 520 815 S860 850 1060 800 1400 760 1600 805 V1000 H0Z"/>
  <path fill="url(#morro2)" d="M0 870 C240 825 420 880 680 885 S1120 825 1320 860 1500 885 1600 860 V1000 H0Z"/>
  <path fill="url(#morro3)" d="M0 945 C260 905 520 950 800 945 S1320 905 1600 950 V1000 H0Z"/>

  <rect width="1600" height="1000" fill="#070433" opacity=".14"/>
